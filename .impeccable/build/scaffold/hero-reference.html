<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: pasteup-comp-b.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tilt+Prism:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#d2ceca}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-paper-ground region texture" data-region="paper-ground" style="background-image:url('../../../assets/plates/paper-ground.png');background-repeat:repeat"></div>
  <div class="r-nombre-ransom region text" data-region="nombre-ransom"><!-- Live identity headline Cristhofer Alegre set as ransom-cut type, not a raster of NOMBRE. --><p style="line-height:1.05;margin:0">nombre-ransom</p></div>
  <div class="r-tagline region text" data-region="tagline"><!-- Small indigo typewriter line: diseño + desarrollo + dirección. --><p style="font-size:var(--r-tagline-font);line-height:1.05;margin:0">tagline</p></div>
  <figure class="r-contacto-stamp region plate" data-region="contacto-stamp"><img src="../../../assets/plates/contacto-stamp.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-contacto-label region control" data-region="contacto-label"><!-- CONTACTO in black condensed type on the pink stamp; this is the primary action.: rebuild the control's chrome from the crop (comp-spec.mjs --crop contacto-label); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-trabajo-sheet region plate" data-region="trabajo-sheet"><img src="../../../assets/plates/trabajo-sheet.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-trabajo-title region text" data-region="trabajo-title"><!-- TRABAJO in heavy black display on the work sheet. --><p style="font-size:var(--r-trabajo-title-font);font-family:var(--r-trabajo-title-family),sans-serif;font-weight:var(--r-trabajo-title-weight);line-height:1.05;margin:0">trabajo-title</p></div>
  <figure class="r-proyecto01-strip region plate" data-region="proyecto01-strip"><img src="../../../assets/plates/proyecto01-strip.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-proyecto01-label region text" data-region="proyecto01-label"><!-- PROYECTO 01 in black typewriter on the pink strip. --><p style="line-height:1.05;margin:0">proyecto01-label</p></div>
  <div class="r-proyecto02-label region text" data-region="proyecto02-label"><!-- PROYECTO 02 in smaller typewriter on the gray work sheet. --><p style="font-size:var(--r-proyecto02-label-font);line-height:1.05;margin:0">proyecto02-label</p></div>
  <figure class="r-camino-card region plate" data-region="camino-card"><img src="../../../assets/plates/camino-card.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-camino-title region text" data-region="camino-title"><!-- CAMINO in typewriter on the stapled card. --><p style="font-size:var(--r-camino-title-font);line-height:1.05;margin:0">camino-title</p></div>
  <div class="r-estudio-block region text" data-region="estudio-block"><!-- Estudio heading and honest placeholder line, no invented school. --><p style="line-height:1.05;margin:0">estudio-block</p></div>
  <div class="r-rol-block region text" data-region="rol-block"><!-- Rol heading and honest placeholder line, no invented employer. --><p style="line-height:1.05;margin:0">rol-block</p></div>
  <figure class="r-skills-scrap region plate" data-region="skills-scrap"><img src="../../../assets/plates/skills-scrap.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-skills-title region text" data-region="skills-title"><!-- SKILLS in typewriter on the taped scrap. --><p style="font-size:var(--r-skills-title-font);line-height:1.05;margin:0">skills-title</p></div>
  <div class="r-skill-cluster region text" data-region="skill-cluster"><!-- Skill cluster placeholder line, underlined, no fake proficiency. --><p style="line-height:1.05;margin:0">skill-cluster</p></div>
</main>
</body>
</html>
